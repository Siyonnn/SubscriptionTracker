name: Send payment reminders

on:
  schedule:
    # 01:00 UTC is 9:00 AM in the Philippines. GitHub can start scheduled runs a little late.
    - cron: '0 1 * * *'
  # Adds a "Run workflow" button on the Actions tab, for testing.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check everything without sending'
        type: boolean
        default: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/send-reminders.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
